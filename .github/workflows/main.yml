name: Main

on:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # manifest version falls back to `git describe` on branch builds
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: install
        run: bun install --frozen-lockfile

      - name: build
        run: bun run build

      - name: lint firefox
        run: bun run --cwd addon lint:firefox

      - name: upload builds
        uses: actions/upload-artifact@v4
        with:
          name: rottenbox-${{ github.sha }}
          path: addon/dist/

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: install
        run: bun install --frozen-lockfile

      - name: restore chrome key
        env:
          CRX_KEY_B64: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          echo "$CRX_KEY_B64" | base64 -d > key.pem
          chmod 600 key.pem
          openssl rsa -in key.pem -check -noout

      - name: collect
        env:
          KEY: ./key.pem
        run: sh ./bin/build.sh

      - name: sign firefox
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          REPO: ${{ github.repository }}
        run: sh ./bin/sign-firefox.sh

      - name: release
        uses: softprops/action-gh-release@v3
        with:
          files: ./release/*
          generate_release_notes: true
