name: Main

on: push

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2 
      - name: install
        run: bun install
      - name: build
        run: bun run --workspaces --parallel build
      - name: collect
        if: github.ref_type == 'tag'
        run: |
          mkdir -p ./release
          cp ./ui/dist/rottenbox.js "./release/rottenbox-${{ github.ref_name }}.js"
          cp ./addon/release/chrome.zip "./release/rottenbox-chrome-${{ github.ref_name }}.zip"
      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: ./release/*
          generate_release_notes: true
            