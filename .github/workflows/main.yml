name: Main

on: push

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
  
      - name: install
        run: bun install

      - name: build
        run: bun run --workspaces --parallel build

      - name: Restore and Normalize Private Key
        env:
          CRX_KEY_B64: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          echo "$CRX_KEY_B64" | base64 -d > key.pem
          chmod 600 key.pem
          openssl rsa -in key.pem -check -noout

      - name: collect
        if: github.ref_type == 'tag'
        env:
          KEY: ./key.pem
          VERSION: ${{ github.ref_name }}
        run: sh ./bin/build.sh

      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: ./release/*
          generate_release_notes: true
