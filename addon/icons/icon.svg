<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 2 120 120" width="128" height="128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- white outline behind everything, so the icon reads on dark toolbars too -->
  <g fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <path d="M64 50 C88 44 110 60 108 84 C106 106 88 116 64 116 C40 116 20 106 20 84 C18 60 40 44 64 50 Z"/>
    <path d="M64 50 l-8 -6 l4 -2 l-6 -6 l10 4 l2 -6 l4 6 l6 -4 l-4 6 l8 2 Z"/>
    <ellipse cx="104" cy="30" rx="4" ry="3"/>
    <ellipse cx="101" cy="27" rx="3" ry="2"/>
    <ellipse cx="107" cy="27" rx="3" ry="2"/>
  </g>

  <mask id="rot">
    <rect x="0" y="0" width="128" height="128" fill="#fff"/>
    <circle cx="36" cy="90" r="7" fill="#000"/>
    <circle cx="58" cy="104" r="4" fill="#000"/>
    <circle cx="90" cy="92" r="9" fill="#000"/>
  </mask>

  <!-- lopsided, slightly wrong tomato body and jagged, unconvinced stem, with rot holes bitten out -->
  <g fill="#2a2a2a" mask="url(#rot)">
    <path d="M64 50 C88 44 110 60 108 84 C106 106 88 116 64 116 C40 116 20 106 20 84 C18 60 40 44 64 50 Z"/>
    <path d="M64 50 l-8 -6 l4 -2 l-6 -6 l10 4 l2 -6 l4 6 l6 -4 l-4 6 l8 2 Z"/>
  </g>
  <circle cx="90" cy="92" r="3" fill="#2a2a2a"/>

  <!-- a single fly, for no clear reason -->
  <ellipse cx="104" cy="30" rx="4" ry="3" fill="#2a2a2a"/>
  <ellipse cx="101" cy="27" rx="3" ry="2" fill="#2a2a2a" opacity="0.4"/>
  <ellipse cx="107" cy="27" rx="3" ry="2" fill="#2a2a2a" opacity="0.4"/>
</svg>
